<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Créateur de personnage — Chroniques Oubliées Fantasy 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>

<header class="bandeau">
  <div class="bandeau-titre">
    <span class="ornement">❧</span>
    <h1>Créateur de personnage</h1>
    <span class="ornement">❧</span>
  </div>
</header>

<nav id="progression" class="progression" aria-label="Progression de la création" hidden>
  <p id="progression-resume" class="progression-resume"></p>
  <ol id="progression-etapes" class="progression-etapes"></ol>
</nav>

<main id="application" class="application">
  <section id="ecran" class="ecran cadre" aria-live="polite">
    <p class="chargement">Ouverture du grimoire…</p>
  </section>

  <aside id="fiche" class="fiche cadre" hidden>
    <h2>Fiche en construction</h2>
    <div id="fiche-contenu"></div>
  </aside>
</main>

<nav id="navigation" class="navigation" hidden>
  <button type="button" id="precedent" class="bouton bouton-secondaire">← Retour</button>
  <span id="erreurs" class="erreurs" role="alert"></span>
  <button type="button" id="suivant" class="bouton">Suivant →</button>
</nav>

<footer class="pied">
  Textes de règles © Black Book Éditions — Chroniques Oubliées Fantasy 2.
  Outil personnel, non public, sans lien avec l'éditeur.
</footer>

<div id="infobulle" class="infobulle" role="tooltip" hidden></div>

<div id="musique" class="musique" hidden>
  <button type="button" id="musique-bouton" class="musique-bouton" aria-pressed="false">
    <span id="musique-symbole" class="musique-symbole" aria-hidden="true">♪</span>
    <span class="musique-libelle">Musique</span>
  </button>
  <audio id="musique-audio" loop preload="none" src="assets/musique.mp3"></audio>
</div>

<script src="vendor/pdf-lib.min.js?v=7"></script>
<script src="js/pdf-repair.js?v=7"></script>
<script src="js/rules.js?v=7"></script>
<script src="js/state.js?v=7"></script>
<script src="js/data.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
<script src="js/dice.js?v=7"></script>
<script src="js/prompt.js?v=7"></script>
<script src="js/pdf.js?v=7"></script>
<script src="js/steps/accueil.js?v=7"></script>
<script src="js/steps/prologue.js?v=7"></script>
<script src="js/steps/sexe.js?v=7"></script>
<script src="js/steps/profil.js?v=7"></script>
<script src="js/steps/peuple.js?v=7"></script>
<script src="js/steps/caracs.js?v=7"></script>
<script src="js/steps/voies.js?v=7"></script>
<script src="js/steps/equipement.js?v=7"></script>
<script src="js/steps/touche.js?v=7"></script>
<script src="js/steps/histoire.js?v=7"></script>
<script src="js/steps/recap.js?v=7"></script>
<script src="js/musique.js?v=7"></script>
<script src="js/main.js?v=7"></script>
</body>
</html>
